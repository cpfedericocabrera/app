<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudio Contable – Gestión</title>
<meta name="theme-color" content="#12263f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudio">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#16202e;--mute:#5d6b7e;--line:#e3e8ef;
  --pri:#1f4e79;--pri2:#2b6cb0;--priL:#e8f0fa;--ok:#1f8a5b;--okL:#e6f5ee;
  --warn:#b7791f;--warnL:#fdf4e3;--bad:#c53030;--badL:#fdeaea;--r:12px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
#app{display:flex;min-height:100vh}
#side{width:232px;background:#12263f;color:#cfd9e6;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;color:#fff}
.brand .lg{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82c4,#1f4e79);display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}.brand small{color:#8fa3bb;font-size:12px}
.nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;color:#cfd9e6;text-decoration:none;margin-bottom:2px;font-weight:500}
.nav a:hover{background:#1b3556}
.nav a.on{background:#2b6cb0;color:#fff}
svg{width:17px;height:17px;flex-shrink:0}
.nav svg,.bnav svg{width:19px;height:19px}
.card h3 svg{color:var(--pri2)}
.side-foot{margin-top:auto;font-size:12px;color:#8fa3bb;padding:8px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:16px 24px;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid transparent}
#top h1{font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sync{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--mute);white-space:nowrap}
#sync.nube{background:var(--okL);color:var(--ok)}#sync.local{background:var(--warnL);color:var(--warn)}
#view{padding:4px 24px 40px;max-width:1200px;width:100%}
.bnav{display:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.kpi small{color:var(--mute);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.kpi b{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#c5cfdc}
.btn.p{background:var(--pri2);border-color:var(--pri2);color:#fff}.btn.p:hover{background:var(--pri)}
.btn.d{color:var(--bad)}.btn.s{padding:5px 9px;font-size:13px}
.btn.ok{background:var(--okL);border-color:#bfe3d0;color:var(--ok)}
.ico{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:7px;color:var(--mute);display:inline-grid;place-items:center}
.ico:hover{background:var(--bg);color:var(--ink)}
.ico svg{width:17px;height:17px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],input[type=email],input[type=tel],input[type=time],select,textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;width:100%;min-height:38px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd3ef;border-color:var(--pri2)}
.bar input,.bar select{width:auto;min-width:140px}
.bar input[type=search]{flex:1;min-width:180px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.cl{cursor:pointer}.row.cl:hover{background:#fafbfd}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .m span{color:var(--mute);font-size:13px}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.date{min-width:50px;text-align:center;border-radius:9px;background:var(--priL);color:var(--pri);padding:5px 4px;font-weight:600;font-size:12px;line-height:1.15}
.date b{display:block;font-size:17px}
.date.bad{background:var(--badL);color:var(--bad)}.date.ok{background:var(--okL);color:var(--ok)}.date.warn{background:var(--warnL);color:var(--warn)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mute);white-space:nowrap}
.tag.ok{background:var(--okL);color:var(--ok)}.tag.bad{background:var(--badL);color:var(--bad)}.tag.warn{background:var(--warnL);color:var(--warn)}.tag.p{background:var(--priL);color:var(--pri)}
.empty{color:var(--mute);text-align:center;padding:22px 10px;font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri2);border-color:var(--pri2)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px}
.kv div small{display:block;color:var(--mute);font-size:12px}
.kv div{font-weight:500;overflow-wrap:anywhere}
.chk{width:20px;height:20px;border:2px solid #b8c4d3;border-radius:6px;display:grid;place-items:center;cursor:pointer;flex-shrink:0;background:#fff}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:13px;height:13px}
.done .m b{text-decoration:line-through;color:var(--mute)}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;color:var(--mute);text-align:center;font-weight:600;padding:4px 0}
.cal .d{min-height:84px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px;cursor:pointer;overflow:hidden}
.cal .d.o{opacity:.4}.cal .d.t{border-color:var(--pri2);box-shadow:inset 0 0 0 1px var(--pri2)}
.cal .d.s{background:var(--priL)}
.cal .d .n{font-size:12px;font-weight:600}
.cal .ev{font-size:11px;border-radius:5px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--priL);color:var(--pri)}
.cal .ev.bad{background:var(--badL);color:var(--bad)}.cal .ev.ok{background:var(--okL);color:var(--ok)}.cal .ev.tk{background:var(--warnL);color:var(--warn)}
.dots{display:none;gap:3px;margin-top:4px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--pri2)}
.dots i.bad{background:var(--bad)}.dots i.ok{background:var(--ok)}.dots i.tk{background:var(--warn)}
/* notas */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.note{border-radius:var(--r);padding:14px;box-shadow:var(--sh);cursor:pointer;background:#fff;border-top:4px solid var(--pri2);min-height:110px}
.note b{display:block;margin-bottom:6px}
.note p{margin:0;color:#384556;font-size:14px;white-space:pre-wrap;max-height:9.5em;overflow:hidden}
.note small{display:block;margin-top:8px;color:var(--mute);font-size:12px}
/* modal */
#modal-root .bk{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.mdl{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mdl.sm{max-width:420px}
.mdl header{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.mdl header h2{font-size:17px;margin:0;flex:1}
.mdl .bd{padding:16px 18px}
.mdl footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:#3a4759}
.f .full{grid-column:1/-1}
.f .hint{font-weight:400;color:var(--mute);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 10px;border-radius:99px;cursor:pointer;font-weight:500}
.chips input{margin:0}
.sec{font-size:12px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.05em;grid-column:1/-1;margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.sec:first-child{border:0;padding-top:0;margin-top:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#16202e;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fi .2s}
#toast div.bad{background:var(--bad)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.tdays{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.tdays input{padding:6px 2px;text-align:center;min-height:34px}
.tdays small{text-align:center;font-size:11px;color:var(--mute)}
.banner{background:var(--warnL);color:#7a5212;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.banner.info{background:var(--priL);color:var(--pri)}
.load{padding:60px;text-align:center;color:var(--mute)}
.more{display:none}
.mono{font-variant-numeric:tabular-nums}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:760px){
  #side{display:none}
  #top{padding:12px 14px;background:#12263f;color:#fff}
  #top h1{font-size:17px}
  #view{padding:12px 12px 96px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);text-decoration:none;padding:6px 0;font-weight:500;border-radius:8px}
  .bnav a.on{color:var(--pri2)}
  .f{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr 1fr}
  .cal .d{min-height:54px;padding:4px}
  .cal .ev{display:none}.dots{display:flex}
  #modal-root .bk{padding:0;align-items:flex-end}
  .mdl{border-radius:16px 16px 0 0;max-height:94vh;display:flex;flex-direction:column}
  .mdl .bd{overflow-y:auto}
  .hide-m{display:none!important}
  .bar input,.bar select{min-width:0;flex:1 1 140px}
  .btn{padding:9px 12px}
  .more{display:block}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><div class="lg">EC</div><div><b id="brandName">Estudio Contable</b><small>Gestión de clientes</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main>
    <header id="top"><h1 id="title">Inicio</h1><span id="sync" data-act="goSync" style="cursor:pointer">…</span></header>
    <div id="view"><div class="load">Cargando tus datos…</div></div>
  </main>
  <nav class="bnav" id="bnav"></nav>
</div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* ============ Íconos ============ */
const I={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 010 8M22 21c0-3-2-5-4-6"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 pay:'<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 11h20M6 15h4"/>',
 fee:'<circle cx="12" cy="12" r="9"/><path d="M15 9a3 3 0 00-3-1.5c-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2a3.3 3.3 0 01-3-1.5M12 6v1.5M12 16.5V18"/>',
 task:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/>',
 note:'<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
 menu:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 check:'<path d="M5 12l5 5L20 7"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 left:'<path d="M15 18l-6-6 6-6"/>',right:'<path d="M9 18l6-6-6-6"/>',
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>',
 wa:'<path d="M21 12a9 9 0 01-13.5 7.8L3 21l1.3-4.4A9 9 0 1121 12z"/>',
 pin:'<path d="M12 17v5M9 3h6l-1 6 3 3H7l3-3z"/>',
 back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
 dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'
};
const ic=(n)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]||''}</svg>`;

/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const curYM=()=>today().slice(0,7);
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const fdate=s=>s?s.split('-').reverse().join('/'):'—';
const fym=ym=>{if(!ym)return'—';const[y,m]=ym.split('-');return `${MESES[+m-1]} ${y}`};
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:2}).format(+n||0);
const num=v=>{if(typeof v==='number')return v;const s=String(v||'').trim();if(!s)return 0;const c=s.includes(',')?s.replace(/\./g,'').replace(',','.'):s;return parseFloat(c)||0};
const daysTo=s=>Math.round((pd(s)-pd(today()))/864e5);
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const dchip=(s,cls='')=>{if(!s)return `<div class="date ${cls}">—</div>`;const[y,m,d]=s.split('-');return `<div class="date ${cls}"><b>${+d}</b>${MES3[+m-1]}</div>`};
const digits=s=>String(s||'').replace(/\D/g,'');
function cuitOk(c){c=digits(c);if(c.length!==11)return false;const w=[5,4,3,2,7,6,5,4,3,2];let s=0;for(let i=0;i<10;i++)s+=+c[i]*w[i];let v=11-(s%11);if(v===11)v=0;if(v===10)return false;return v===+c[10]}
const fcuit=c=>{c=digits(c);return c.length===11?`${c.slice(0,2)}-${c.slice(2,10)}-${c.slice(10)}`:(c||'—')};
const waNum=t=>{let d=digits(t);if(!d)return'';if(d.startsWith('54'))return d;d=d.replace(/^0/,'');return '549'+d.replace(/^9/,'')};

/* ============ Configuración por defecto ============ */
const E10=()=>['','','','','','','','','',''];
const DEF={
 estudio:{nombre:'Estudio Contable',profesional:'',matricula:'',telefono:'',email:'',alias:''},
 obligaciones:[
  {id:'mono',nombre:'Monotributo – cuota mensual',organismo:'ARCA',tipo:'fijo',dia:20,dias:E10(),periodicidad:'mensual',mes:'',desfase:0},
  {id:'iva',nombre:'IVA – DDJJ y pago',organismo:'ARCA',tipo:'terminacion',dia:'',dias:E10(),periodicidad:'mensual',mes:'',desfase:1},
  {id:'suss',nombre:'F.931 – Cargas sociales',organismo:'ARCA',tipo:'terminacion',dia:'',dias:E10(),periodicidad:'mensual',mes:'',desfase:1},
  {id:'iibb',nombre:'Ingresos Brutos – anticipo',organismo:'ATP Formosa',tipo:'terminacion',dia:'',dias:E10(),periodicidad:'mensual',mes:'',desfase:1},
  {id:'muni',nombre:'Tasa municipal comercio e industria',organismo:'Municipalidad',tipo:'fijo',dia:'',dias:E10(),periodicidad:'mensual',mes:'',desfase:1},

function saveLocal(){try{const o={config:S.config};COLS.forEach(c=>o[c]=S[c]);localStorage.setItem(LKEY,JSON.stringify(o))}catch(e){toast('No se pudo guardar en este dispositivo','bad')}}
const fbBase=()=>FB.db.collection('users').doc(FB.uid);
const cloudErr=e=>{console.error(e);toast(e&&e.code==='permission-denied'?'La nube rechazó el guardado: revisá las reglas de Firestore':'No se pudo sincronizar con la nube (queda guardado en el dispositivo)','bad')};
async function put(col,obj){
 const o={...obj};if(!o.id)o.id=newId();o.upd=Date.now();
 for(const k in o)if(o[k]===undefined)delete o[k];
 const a=S[col];const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);
 saveLocal();sched();
 if(S.mode==='nube'){const body={...o};delete body.id;fbBase().collection(col).doc(o.id).set(body).catch(cloudErr)}
 return o.id;
}
async function del(col,id){
 S[col]=S[col].filter(x=>x.id!==id);saveLocal();sched();
 if(S.mode==='nube')fbBase().collection(col).doc(id).delete().catch(cloudErr);
}

function parseFbConfig(txt){
 const m=String(txt||'').match(/\{[\s\S]*\}/);if(!m)return null;
 let s=m[0].replace(/\/\/.*$/gm,'').replace(/'/g,'"').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}');
 try{const o=JSON.parse(s);return o.apiKey&&o.projectId?o:null}catch(e){return null}
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function connectFirebase(fc){
 S.fb='cargando';syncBadge();sched();
 try{
  if(!window.firebase){const v='10.12.2',b=`https://www.gstatic.com/firebasejs/${v}/`;await loadScript(b+'firebase-app-compat.js');await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-firestore-compat.js')])}
  if(!firebase.apps.length)firebase.initializeApp(fc);
  const db=firebase.firestore();try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  FB={auth:firebase.auth(),db,uid:null,email:''};
  FB.auth.onAuthStateChanged(u=>{if(u){FB.uid=u.uid;FB.email=u.email||'';startSync()}else{stopSync();FB.uid=null;S.mode='local';S.fb='sesion';syncBadge();sched()}});
 }catch(e){console.error(e);S.fb='error';S.mode='local';syncBadge();sched();toast('No se pudo conectar con Firebase. Seguís trabajando en el dispositivo.','bad')}
}
function stopSync(){UNSUB.forEach(f=>{try{f()}catch(e){}});UNSUB=[]}
async function startSync(){
 stopSync();S.fb='sincronizando';syncBadge();sched();
 const base=fbBase();
 try{
  const checks=await Promise.all([...COLS.map(c=>base.collection(c).limit(1).get()),base.collection('config').doc('main').get()]);
  const remoteEmpty=checks.slice(0,COLS.length).every(s=>s.empty)&&!checks[COLS.length].exists;
  const localN=COLS.reduce((a,c)=>a+S[c].length,0);
  try{localStorage.setItem(LKEY+'-antes-de-sincronizar',localStorage.getItem(LKEY)||'')}catch(e){}
  if(remoteEmpty&&localN){
   toast(`Subiendo ${localN} registros de este dispositivo a tu cuenta…`);
   const all=[];COLS.forEach(c=>S[c].forEach(r=>{const b={...r};delete b.id;all.push([base.collection(c).doc(r.id),b])}));
   all.push([base.collection('config').doc('main'),clone(S.config)]);
   for(let i=0;i<all.length;i+=400){const bt=FB.db.batch();all.slice(i,i+400).forEach(([r,b])=>bt.set(r,b));await bt.commit()}
  }
 }catch(e){cloudErr(e);S.fb='error';S.mode='local';syncBadge();sched();return}
 S.mode='nube';S.fb='ok';syncBadge();
 COLS.forEach(c=>UNSUB.push(base.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({...d.data(),id:d.id}));saveLocal();sched()},cloudErr)));
 UNSUB.push(base.collection('config').doc('main').onSnapshot(d=>{if(d.exists){S.config=mergeCfg(d.data());saveLocal();sched()}},cloudErr));
 sched();
}

VIEWS.agenda=()=>{
 const u=S.ui;const ym=u.calYM;const[y,m]=ym.split('-').map(Number);
 const first=new Date(y,m-1,1);const off=(first.getDay()+6)%7;const start=addDays(ymd(first),-off);
 const evs=S.eventos.filter(e=>!u.calTipo||e.tipo===u.calTipo);
 const tks=u.calTipo&&u.calTipo!=='tarea'?[]:S.tareas.filter(t=>t.fecha&&t.estado!=='hecha');
 const map={};evs.forEach(e=>{(map[e.fecha]=map[e.fecha]||[]).push({k:'e',o:e})});
 if(!u.calTipo||u.calTipo==='tarea')tks.forEach(t=>{(map[t.fecha]=map[t.fecha]||[]).push({k:'t',o:t})});
 let cells='';['Lu','Ma','Mi','Ju','Vi','Sá','Do'].forEach(d=>cells+=`<div class="h">${d}</div>`);
 for(let i=0;i<42;i++){const d=addDays(start,i);const it=map[d]||[];
  const cls=(e)=>e.k==='t'?'tk':evState(e.o);
  cells+=`<div class="d ${d.slice(0,7)!==ym?'o':''} ${d===today()?'t':''} ${d===u.calDay?'s':''}" data-act="calDay" data-d="${d}">
   <div class="n">${+d.slice(8)}</div>
   ${it.slice(0,3).map(e=>`<div class="ev ${cls(e)}">${esc(e.o.titulo)}</div>`).join('')}${it.length>3?`<div class="ev">+${it.length-3} más</div>`:''}
   <div class="dots">${it.slice(0,6).map(e=>`<i class="${cls(e)}"></i>`).join('')}</div></div>`;
  if(i===34&&addDays(start,35).slice(0,7)!==ym)break;
 }
 const sel=(map[u.calDay]||[]);
 const monthEv=evs.filter(e=>e.fecha&&e.fecha.startsWith(ym)).sort(byDate);
 const pend=monthEv.filter(e=>e.estado!=='cumplido').length;
 const h=`<div class="bar">
  <button class="ico" data-act="calNav" data-n="-1">${ic('left')}</button><b style="min-width:130px;text-align:center;text-transform:capitalize">${fym(ym)}</b><button class="ico" data-act="calNav" data-n="1">${ic('right')}</button>
  <button class="btn s" data-act="calHoy">Hoy</button>
  <select id="f-calTipo" data-f="calTipo" style="min-width:0;width:auto">${opt([['','Todo'],['vencimiento','Vencimientos'],['reunion','Reuniones'],['tramite','Trámites'],['recordatorio','Recordatorios'],['tarea','Tareas']],u.calTipo)}</select>
  <span class="sp"></span>
  <button class="btn" data-act="genVto">${ic('cal')}Generar vencimientos</button>
  <button class="btn p" data-act="evNew" data-fecha="${u.calDay}">${ic('plus')}Evento</button></div>
 <div class="card"><div class="cal">${cells}</div></div>
 <div class="grid g2">
  <div class="card"><h3>${fdate(u.calDay)} <span class="sp"></span><button class="btn s" data-act="evNew" data-fecha="${u.calDay}">${ic('plus')}Agregar</button></h3>
   <div class="list">${sel.map(x=>x.k==='e'?evRow(x.o):taskRow(x.o)).join('')||empty('Nada para este día.')}</div></div>
  <div class="card"><h3>Todo ${fym(ym)} <span class="sp"></span><span class="tag ${pend?'warn':'ok'}">${pend} pendiente${pend===1?'':'s'}</span></h3>
   <div class="list">${monthEv.map(e=>evRow(e)).join('')||empty('Sin eventos este mes.')}</div></div>
 </div>`;
 return{t:'Agenda y vencimientos',h};
};

/* ============ Modales ============ */
function modal({title,body,save='Guardar',onSave,del,sm,extra=''}){
 const root=$('#modal-root');
 root.innerHTML=`<div class="bk"><form class="mdl ${sm?'sm':''}" novalidate><header><h2>${esc(title)}</h2><button type="button" class="ico" data-close>${ic('x')}</button></header><div class="bd">${body}</div>
  <footer>${del?`<button type="button" class="btn d" data-del style="margin-right:auto">${ic('trash')}Eliminar</button>`:''}${extra}<button type="button" class="btn" data-close>Cancelar</button>${onSave?`<button class="btn p">${esc(save)}</button>`:''}</footer></form></div>`;
 const f=root.querySelector('form');
 const close=()=>{root.innerHTML=''};
 root.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
 root.querySelector('.bk').addEventListener('mousedown',e=>{if(e.target.classList.contains('bk'))close()});
 if(del)root.querySelector('[data-del]').onclick=()=>confirmBox('¿Eliminar definitivamente?',async()=>{await del();close()});
 f.onsubmit=async e=>{e.preventDefault();const req=[...f.querySelectorAll('[required]')].find(x=>!String(x.value).trim());if(req){req.focus();req.style.borderColor='var(--bad)';toast('Completá los campos obligatorios','bad');return}
  const fd=new FormData(f);const o={};for(const[k,v]of fd.entries()){if(k in o){o[k]=[].concat(o[k],v)}else o[k]=v}
  f.querySelectorAll('input[type=checkbox][data-multi]').forEach(x=>{if(!(x.name in o))o[x.name]=[];else if(!Array.isArray(o[x.name]))o[x.name]=[o[x.name]]});
  const btn=f.querySelector('footer .btn.p');if(btn)btn.disabled=true;
  try{const r=await onSave(o,f);if(r!==false)close()}catch(err){console.error(err);toast('No se pudo guardar','bad')}finally{if(btn)btn.disabled=false}};
 setTimeout(()=>{const x=f.querySelector('.bd input:not([type=hidden]):not([type=checkbox]),.bd textarea');if(x&&window.innerWidth>760)x.focus()},30);
 return f;
}
function confirmBox(msg,onYes,yes='Eliminar'){
 const d=document.createElement('div');d.className='bk';d.style.zIndex=60;
 d.innerHTML=`<div class="mdl sm"><div class="bd" style="padding:20px 18px;font-weight:500">${esc(msg)}</div><footer><button class="btn" data-n>Cancelar</button><button class="btn p" data-y style="background:var(--bad);border-color:var(--bad)">${esc(yes)}</button></footer></div>`;
 $('#modal-root').appendChild(d);
 d.querySelector('[data-n]').onclick=()=>d.remove();
 d.querySelector('[data-y]').onclick=async()=>{d.remove();await safe(onYes)};
}
let tT;function toast(msg,cls=''){const t=document.createElement('div');t.textContent=msg;if(cls)t.className=cls;$('#toast').appendChild(t);setTimeout(()=>t.remove(),3200)}
const L_=(lab,inner,cls='')=>`<label class="${cls}">${lab}${inner}</label>`;

function formEvento(e={}){

  ${L_('Estado',`<select name="estado">${opt([['pendiente','Pendiente'],['cumplido','Cumplido']],e.estado)}</select>`)}
  ${isNew?L_('Repetir',`<select name="repetir">${opt([['0','No se repite'],['3','Mensual, 3 meses'],['6','Mensual, 6 meses'],['12','Mensual, 12 meses']],'0')}</select>`):''}
  ${L_('Notas',`<textarea name="nota">${esc(e.nota)}</textarea>`,'full')}
 </div>`,
 del:isNew?null:()=>safe(()=>del('eventos',e.id),'Evento eliminado'),
 onSave:async o=>{const rep=+o.repetir||0;delete o.repetir;
  await safe(async()=>{await put('eventos',{...e,...o});
   for(let i=1;i<rep;i++){const ym=addMonths(o.fecha.slice(0,7),i);const[y,m]=ym.split('-').map(Number);const last=new Date(y,m,0).getDate();const d=Math.min(+o.fecha.slice(8),last);await put('eventos',{...o,id:undefined,fecha:`${ym}-${pad(d)}`,estado:'pendiente'})}

}

 </div>`,
 del:isNew||['mono'].includes(o.id)?null:async()=>{S.config.obligaciones=cfg().obligaciones.filter(x=>x.id!==o.id);await safe(putCfg,'Obligación eliminada')},
 onSave:async v=>{const n={id:o.id,nombre:v.nombre,organismo:v.organismo,periodicidad:v.periodicidad,mes:v.mes?+v.mes:'',desfase:+v.desfase,tipo:v.tipo,dia:v.dia?+v.dia:'',dias:[...Array(10)].map((_,i)=>v['d'+i]?+v['d'+i]:'')};

/* --- Generar vencimientos --- */
function genVto(){
 const ym=S.ui.calYM;
 const C=S.clientes.filter(c=>c.estado!=='baja'&&(c.obligaciones||[]).length);
 modal({title:'Generar vencimientos',sm:true,save:'Generar',body:`<div class="f" style="grid-template-columns:1fr">
  ${L_('Mes',`<input type="month" name="ym" value="${ym}" required>`)}
  <p style="margin:0;font-size:13.5px;color:var(--mute)">Se crean los vencimientos de <b>${C.length}</b> cliente${C.length===1?'':'s'} activos según las obligaciones de cada uno y los días cargados en Ajustes. Los que ya existen no se duplican.</p>
 </div>`,
 onSave:async v=>{
  const ym=v.ym;let n=0,skip=0;const errs=new Set();
  for(const c of C){for(const oid of c.obligaciones){const o=obl(oid);if(!o)continue;
   if(o.periodicidad==='anual'&&+o.mes!==+ym.slice(5))continue;
   const id='v_'+c.id+'_'+o.id+'_'+ym.replace('-','');
   if(S.eventos.some(e=>e.id===id)){skip++;continue}
   const r=vtoFecha(o,c,ym);if(r.err){errs.add(`${o.nombre}: ${r.err}${r.err.includes('CUIT')?' ('+c.nombre+')':''}`);continue}
   try{await put('eventos',{id,titulo:o.nombre,tipo:'vencimiento',fecha:r.fecha,clienteId:c.id,organismo:o.organismo,periodo:periodoDe(o,ym),oblId:o.id,estado:'pendiente',auto:true});n++}catch(e){errs.add('Error al guardar');break}
  }}
  S.ui.calYM=ym;sched();
  if(errs.size){modal({title:'Vencimientos generados',sm:true,body:`<p style="margin-top:0"><b>${n}</b> creados${skip?`, ${skip} ya existían`:''}.</p><p>No se pudieron generar estos (completalos en <a href="#ajustes" data-close>Ajustes</a> o en el cliente):</p><ul style="font-size:13.5px;color:var(--mute);padding-left:18px">${[...errs].slice(0,15).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`})
   ;return false}
  toast(`${n} vencimiento${n===1?'':'s'} creado${n===1?'':'s'}${skip?` · ${skip} ya existían`:''}`);
 }});
}

/* --- Generar honorarios --- */
function genHon(){
 const ym=S.ui.hym;const C=S.clientes.filter(c=>c.estado!=='baja'&&num(c.honorario)>0);
 modal({title:`Generar honorarios de ${fym(ym)}`,sm:true,save:'Generar',body:`<p style="margin:0;font-size:14px">Se carga el abono mensual a <b>${C.length}</b> clientes activos (total ${money(C.reduce((a,c)=>a+num(c.honorario),0))}). Si un cliente ya tiene el abono de ese mes, no se duplica.</p>`,
 onSave:async()=>{let n=0,s=0;for(const c of C){const id='h_'+c.id+'_'+ym.replace('-','');if(S.movs.some(m=>m.id===id)){s++;continue}
   try{await put('movs',{id,clienteId:c.id,tipo:'cargo',fecha:`${ym}-01`,periodo:ym,concepto:'Abono mensual',importe:num(c.honorario),auto:true});n++}catch(e){toast('Error al guardar','bad');break}}
  toast(`${n} honorario${n===1?'':'s'} cargado${n===1?'':'s'}${s?` · ${s} ya existían`:''}`)}});
}
function aumento(){
 modal({title:'Aumento de honorarios',sm:true,save:'Aplicar',body:`<div class="f" style="grid-template-columns:1fr">${L_('Porcentaje de aumento',`<input type="text" name="p" inputmode="decimal" required placeholder="Ej.: 10">`)}${L_('Redondear a',`<select name="r">${opt([['1','Sin redondeo'],['100','$100'],['500','$500'],['1000','$1.000']],'100')}</select>`)}<p style="margin:0;font-size:13px;color:var(--mute)">Se actualiza el honorario mensual de todos los clientes activos. No cambia lo ya cargado.</p></div>`,
 onSave:async v=>{const p=num(v.p);const r=+v.r||1;if(!p)return false;let n=0;for(const c of S.clientes.filter(c=>c.estado!=='baja'&&num(c.honorario)>0)){const nv=Math.round(num(c.honorario)*(1+p/100)/r)*r;try{await put('clientes',{...c,honorario:nv});n++}catch(e){break}}toast(`${n} honorarios actualizados (+${p}%)`)}});
}

/* --- Textos --- */
function msgRecordatorio(c){const s=saldoCli(c.id);const e=cfg().estudio;
 return `Hola ${c.contacto||c.nombre}! ¿Cómo estás? Te escribo de ${e.nombre||'el estudio'} para recordarte que tenés un saldo de honorarios de ${money(s)}.${e.alias?`\nPodés transferir al alias: ${e.alias}`:''}\nCualquier cosa avisame. ¡Gracias!${e.profesional?`\n${e.profesional}`:''}`}
function msgRecibo(m){const c=cli(m.clienteId)||{};const e=cfg().estudio;
 return `RECIBO DE HONORARIOS\n${e.nombre||''}${e.profesional?' – '+e.profesional:''}${e.matricula?' – Mat. '+e.matricula:''}\n\nRecibí de ${c.nombre||''}${c.cuit?' (CUIT '+fcuit(c.cuit)+')':''} la suma de ${money(m.importe)} en concepto de ${m.concepto||'honorarios profesionales'}${m.periodo?' correspondientes a '+fym(m.periodo):''}.\nFecha: ${fdate(m.fecha)}${m.medio?' · Medio: '+m.medio:''}${m.factura?' · Factura N° '+m.factura:''}\nSaldo pendiente: ${money(Math.max(0,saldoCli(m.clienteId)))}`}
function textModal(title,txt,wa){
 modal({title,body:`<textarea id="txtOut" style="min-height:200px;font-size:14px">${esc(txt)}</textarea>`,extra:`${wa?`<a class="btn" href="https://wa.me/${wa}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">${ic('wa')}Abrir WhatsApp</a>`:''}<button type="button" class="btn p" id="txtCopy">${ic('copy')}Copiar</button>`});
 $('#txtCopy').onclick=()=>copy($('#txtOut').value);

async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){toast('No se pudo copiar: seleccioná el texto y copialo a mano','bad')}}

/* --- Export --- */
function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\n')}
async function saveFile(name,data){
 try{const blob=new Blob([data],{type:name.endsWith('.csv')?'text/csv;charset=utf-8':'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Archivo descargado')}
 catch(e){textModal('Copiá el contenido',data)}
}
function backupJSON(){const o={app:'estudio-contable',v:1,fecha:new Date().toISOString(),config:S.config};COLS.forEach(c=>o[c]=S[c]);return JSON.stringify(o,null,1)}
async function restore(file){
 let j;try{j=JSON.parse(await file.text())}catch(e){toast('El archivo no es una copia válida','bad');return}
 if(!j||j.app!=='estudio-contable'){toast('El archivo no es una copia de esta app','bad');return}
 const n=COLS.reduce((a,c)=>a+(j[c]||[]).length,0);
 confirmBox(`Se van a importar ${n} registros. Los que tengan el mismo identificador se reemplazan. ¿Seguir?`,async()=>{
  toast('Restaurando…');if(j.config){S.config=mergeCfg(j.config);await putCfg()}
  for(const c of COLS)for(const r of (j[c]||[])){if(r&&r.id)await put(c,r)}
  toast('Copia restaurada');
 },'Restaurar');
}
